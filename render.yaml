# Render Blueprint for the CalibrationCompass API.
# Deploy by pointing Render at this repo (New + > Blueprint), or configure a
# Web Service manually with the settings mirrored below.
services:
  - type: web
    name: calibrationcompass-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: IBM_QUANTUM_TOKEN
        sync: false        # set in the Render dashboard (secret)
      - key: IBM_CHANNEL
        value: ibm_quantum_platform
      - key: IBM_INSTANCE
        value: open-instance
      - key: FRONTEND_ORIGIN
        sync: false        # set to your Vercel URL after the frontend is live
